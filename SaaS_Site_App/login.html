<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Synapsea</title>
  <link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page" data-auth-required="false">
  <main class="auth-shell">
    <div class="auth-brand"><span class="brand-mark">S</span><div><strong>Synapsea</strong><span>Health Tech Platform</span></div></div>
    <section class="card auth-card">
      <h1>Acessar plataforma</h1><p>Entre para visualizar os dados associados ao seu perfil.</p>
      <form class="auth-form" id="login-form">
        <div class="field"><label for="login-email">Email</label><input class="input" id="login-email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="login-password">Senha</label><input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required></div>
        <p class="auth-message" id="auth-message" aria-live="polite"></p>
        <button class="btn btn-primary" type="submit">Entrar</button>
      </form>
      <p class="auth-footer">Ainda nao tem conta? <a href="register.html">Criar cadastro</a></p>
    </section>
    <p class="auth-note">Plataforma academica de monitoramento educacional.</p>
  </main>
  <script src="js/session.js"></script><script src="js/auth.js"></script>
</body>
</html>
