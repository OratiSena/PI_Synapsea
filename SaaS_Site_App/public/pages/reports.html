<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatórios | Synapsea</title>
  <link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/reports.css">
</head>
<body data-page="reports" data-title="Relatórios">
  <div class="app-shell"><main class="page-main"><div class="page-content">
    <section class="page-heading"><div><h1>Relatórios educacionais</h1><p>Resumos gerados exclusivamente a partir dos dados reais persistidos.</p></div><button class="btn btn-primary" id="open-report-modal" type="button">Gerar relatório educacional</button></section>
    <div class="notice"><strong>i</strong><span>Todo relatório do Synapsea é educacional e não constitui laudo ou diagnóstico médico.</span></div>
    <div id="reports-grid" style="margin-top:18px"></div>
  </div></main></div>
  <div class="modal" id="report-modal" role="dialog" aria-modal="true" aria-labelledby="report-title">
    <div class="modal-panel">
      <div class="modal-header"><h2 id="report-title">Gerar relatório educacional</h2><button class="icon-button" data-close-report-modal type="button">×</button></div>
      <div class="modal-body">
        <form id="report-form">
          <div class="field"><label for="report-patient">Paciente</label><select class="select" id="report-patient" name="patientId" required></select></div>
          <div class="field" style="margin-top:16px"><label for="report-period">Período</label><select class="select" id="report-period" name="period"><option value="last_24h">Últimas 24 horas</option><option value="last_7d">Últimos 7 dias</option><option value="last_30d">Últimos 30 dias</option></select></div>
          <div class="form-actions"><button class="btn" data-close-report-modal type="button">Cancelar</button><button class="btn btn-primary" type="submit">Gerar relatório</button></div>
        </form>
      </div>
    </div>
  </div>
  <script src="../js/session.js"></script><script src="../js/utils.js"></script><script src="../js/data.js"></script><script src="../js/layout.js"></script><script src="../js/reports.js"></script>
</body>
</html>
